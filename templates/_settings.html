  <section class="settings" id="settings" x-show="settingsOpen" x-cloak>
    <label class="f"><span>Wort correction factor</span>
      <input type="number" step="0.01" min="0.9" max="1.2" inputmode="decimal" x-init="$el.value = state.wcf" @input="setWcf($event.target.value)">
    </label>
    <label class="f"><span>Formula</span>
      <select x-model="state.formula">
        <option value="old">Terrill cubic (classic)</option>
        <option value="new">Terrill cubic (2011 revision)</option>
        <option value="notes">My Apple Notes version</option>
      </select>
    </label>
    <p x-text="notes[state.formula]"></p>
  </section>
